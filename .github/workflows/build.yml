name: Build Maya APK
on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

env:
  DRIVE_FOLDER_URL: https://drive.google.com/drive/folders/1CSgGOVhjzDlzWUkWZbj0bXnvbaw82_4t

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip autoconf automake libtool \
            pkg-config zlib1g-dev libncurses-dev cmake libffi-dev libssl-dev \
            libltdl-dev build-essential ccache

      - name: Install Buildozer and gdown
        run: |
          python -m pip install --upgrade pip
          pip install --upgrade buildozer cython virtualenv gdown

      - name: Download the app files from Google Drive
        run: |
          set -euo pipefail
          rm -rf drive_files
          gdown --folder "$DRIVE_FOLDER_URL" -O drive_files
          find drive_files -maxdepth 3 -type f | head -n 100

      - name: Find the project folder
        run: |
          set -euo pipefail
          SPEC=$(find drive_files -name buildozer.spec | head -n 1)
          if [ -z "$SPEC" ]; then
            echo "buildozer.spec was not found in the Drive folder" >&2
            exit 1
          fi
          echo "APP_DIR=$(dirname "$SPEC")" >> "$GITHUB_ENV"

      - name: Cache Android SDK/NDK and signing key
        uses: actions/cache@v4
        with:
          path: |
            ~/.buildozer
            ~/.android
          key: buildozer-${{ runner.os }}-v1

      - name: Build the APK
        working-directory: ${{ env.APP_DIR }}
        run: |
          set -euo pipefail
          yes | buildozer -v android debug
          ls -la bin

      - name: Copy the APK into the repo
        run: |
          set -euo pipefail
          mkdir -p apk
          rm -f apk/*.apk
          cp "$APP_DIR"/bin/*.apk apk/
          ls -la apk

      - name: Upload the APK as an artifact
        uses: actions/upload-artifact@v4
        with:
          name: maya-apk
          path: apk/*.apk

      - name: Commit the APK to the repo
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apk/
          if git diff --cached --quiet; then
            echo "APK is unchanged, nothing to commit."
          else
            git commit -m "Build Maya APK [skip ci]"
            git push
          fi
